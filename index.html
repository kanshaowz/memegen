            --primary: #2d6a4f;
            --primary-light: #52b788;
            --primary-dark: #1b4332;
            --accent: #d8f3dc;
            --bg-light: #f1f8f4;
            --text: #2c3e50;
            --text-light: #5a6c7d;
            --leaf-1: #95d5b2;
            --leaf-2: #74c69d;
            --leaf-3: #52b788;
            --sunshine: #ffd166;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f1f8f4 0%, #e8f5e9 50%, #d4edda 100%);
            min-height: 100vh;
            color: var(--text);
            position: relative;
            overflow-x: hidden;
        }

        /* 装饰叶子 */
        .leaf {
            position: fixed;
            opacity: 0.15;
            pointer-events: none;
            z-index: 0;
        }
        .leaf-1 { top: 10%; left: 5%; font-size: 120px; transform: rotate(-15deg); }
        .leaf-2 { top: 30%; right: 8%; font-size: 80px; transform: rotate(25deg); }
        .leaf-3 { bottom: 20%; left: 10%; font-size: 100px; transform: rotate(45deg); }
        .leaf-4 { bottom: 30%; right: 5%; font-size: 60px; transform: rotate(-30deg); }
        .leaf-5 { top: 60%; left: 3%; font-size: 70px; transform: rotate(60deg); }

        /* 容器 */
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        /* 头部 */
        header {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }

        .logo-icon {
            font-size: 48px;
            animation: sway 3s ease-in-out infinite;
        }

        @keyframes sway {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
            font-weight: 700;
            letter-spacing: -1px;
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.1rem;
            max-width: 500px;
            margin: 0 auto;
            line-height: 1.6;
        }

        /* 主卡片 */
        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(45, 106, 79, 0.1);
            border: 1px solid rgba(82, 183, 136, 0.2);
            backdrop-filter: blur(10px);
        }

        /* 控制区 */
        .controls {
            display: grid;
            gap: 25px;
            margin-bottom: 30px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .control-label {
            font-weight: 600;
            color: var(--primary-dark);
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-label::before {
            content: "🌿";
        }

        /* 语言选择 */
        .language-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
        }

        .lang-btn {
            padding: 12px 16px;
            border: 2px solid var(--leaf-1);
            background: white;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--primary);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .lang-btn:hover {
            background: var(--accent);
            transform: translateY(-2px);
        }

        .lang-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(45, 106, 79, 0.3);
        }

        .lang-flag {
            font-size: 1.2rem;
        }

        /* 段落数滑块 */
        .slider-container {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .slider-wrapper {
            flex: 1;
            min-width: 200px;
            position: relative;
        }

        input[type="range"] {
            width: 100%;
            height: 8px;
            border-radius: 4px;
            background: linear-gradient(to right, var(--leaf-1), var(--primary));
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--primary);
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(45, 106, 79, 0.3);
            transition: transform 0.2s;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
        }

        .paragraph-count {
            background: var(--primary);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 1.1rem;
            min-width: 50px;
            text-align: center;
        }

        /* 生成按钮 */
        .generate-btn {
            width: 100%;
            padding: 18px 32px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(45, 106, 79, 0.3);
        }

        .generate-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(45, 106, 79, 0.4);
        }

        .generate-btn:active {
            transform: translateY(-1px);
        }

        /* 输出区 */
        .output-section {
            margin-top: 30px;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .output-title {
            font-weight: 600;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .copy-btn {
            padding: 10px 20px;
            background: var(--accent);
            color: var(--primary-dark);
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .copy-btn:hover {
            background: var(--leaf-1);
            transform: scale(1.05);
        }

        .copy-btn.copied {
            background: var(--primary);
            color: white;
        }

        textarea {
            width: 100%;
            min-height: 300px;
            padding: 20px;
            border: 2px solid var(--leaf-1);
            border-radius: 16px;
            font-size: 1rem;
            line-height: 1.8;
            color: var(--text);
            background: var(--bg-light);
            resize: vertical;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary);
        }

        /* 统计信息 */
        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        .stat-value {
            font-weight: 700;
            color: var(--primary);
        }

        /* 页脚 */
        footer {
            text-align: center;
            margin-top: 40px;
            color: var(--text-light);
            font-size: 0.9rem;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
        }

        /* 响应式 */
        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .card { padding: 25px; }
            .language-grid { grid-template-columns: repeat(3, 1fr); }
            .lang-btn { padding: 10px; font-size: 0.85rem; }
        }

        // 当前语言
        let currentLang = 'en';

        // DOM 元素
        const langBtns = document.querySelectorAll('.lang-btn');
        const paragraphSlider = document.getElementById('paragraphSlider');
        const paragraphCountDisplay = document.getElementById('paragraphCount');
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const output = document.getElementById('output');
        const wordCountDisplay = document.getElementById('wordCount');
        const charCountDisplay = document.getElementById('charCount');
        const paraCountDisplay = document.getElementById('paraCount');

        // 语言切换
        langBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                langBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentLang = btn.dataset.lang;
                updateUI();
            });
        });

        // 更新界面语言
        function updateUI() {
            const texts = i18n[currentLang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.dataset.i18n;
                if (texts[key]) {
                    el.textContent = texts[key];
                }
            });
            output.placeholder = texts.placeholder;
        }

        // 滑块更新
        paragraphSlider.addEventListener('input', () => {
            paragraphCountDisplay.textContent = paragraphSlider.value;
        });

        // 生成文本
        function generateText() {
            const count = parseInt(paragraphSlider.value);
            const texts = loremTexts[currentLang];
            const result = [];
            
            for (let i = 0; i < count; i++) {
                const randomIndex = Math.floor(Math.random() * texts.length);
                result.push(texts[randomIndex]);
            }
            
            const finalText = result.join('\n\n');
            output.value = finalText;
            updateStats(finalText);
        }

        // 更新统计
        function updateStats(text) {
            const charCount = text.length;
            const wordCount = text.trim().split(/\s+/).filter(w => w.length > 0).length;
            const paraCount = text.trim().split(/\n\n+/).filter(p => p.length > 0).length;
            
            charCountDisplay.textContent = charCount.toLocaleString();
            wordCountDisplay.textContent = wordCount.toLocaleString();
            paraCountDisplay.textContent = paraCount;
        }

        // 复制功能
        async function copyText() {
            if (!output.value.trim()) return;
            
            try {
                await navigator.clipboard.writeText(output.value);
                const originalText = copyBtn.innerHTML;
                const copiedText = i18n[currentLang].copied;
                
                copyBtn.innerHTML = `<span>✅</span><span>${copiedText}</span>`;
                copyBtn.classList.add('copied');
                
                setTimeout(() => {
                    copyBtn.innerHTML = originalText;
                    copyBtn.classList.remove('copied');
                }, 2000);
            } catch (err) {
                // 降级方案
                output.select();
                document.execCommand('copy');
                alert(i18n[currentLang].copied);
            }
        }

        // 事件监听
        generateBtn.addEventListener('click', generateText);
        copyBtn.addEventListener('click', copyText);

        // 初始化
        generateText();
    </script>
